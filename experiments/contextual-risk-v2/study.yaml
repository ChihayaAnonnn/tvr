  test_authorized: false
  max_gpu_hours: 8
  physical_indices: [0, 2, 3, 4]
  gpu_uuids:
    - GPU-6906cf09-5cb8-4373-8f3e-7636c4e9fece
    - GPU-19f58384-1ce3-9658-5a8b-7d79f437289d
    - GPU-8dab94cb-3e36-d6b4-61a8-a617b5dc7ede
    - GPU-258756c4-a25e-4280-c8b7-6811dfbcf49a
  model: production_capacity_random_initialization_vit_b32
